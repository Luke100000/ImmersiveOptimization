plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'net.fabricmc.fabric-loom' version '1.17.14' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

def getAppVersion = { ->
    try {
        def result = providers.exec {
            commandLine 'git', 'tag', '--points-at', 'HEAD'
        }
        def tag = result.standardOutput.asText.get().trim()
        if (tag.isEmpty()) return "0.0.0-SNAPSHOT"
        return tag.split('\\+')[0]
    } catch (Exception e) {
        println "Warning: ${e.message}, is git installed?"
        return "0.0.0-DEV"
    }
} as Object


subprojects {
    version = getAppVersion()
}
